<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self' blob: 'wasm-unsafe-eval' https://cdn.jsdelivr.net;
        worker-src 'self' blob:;
        connect-src 'self' blob: data:
          https://huggingface.co https://*.huggingface.co https://*.hf.co
          https://cdn.jsdelivr.net;
        media-src 'self' blob:
      "
    />
    <title>Clicky Audio Host</title>
  </head>
  <body>
    <!--
      This window is never shown. It exists only to host the Web Audio APIs
      (microphone capture and MP3 playback) that the main process can't use
      directly. See src/main/audioWindow.ts for why.
    -->
    <script src="audio.js"></script>
  </body>
</html>
