<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <title>Clicky Overlay</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <!--
      The whole page is transparent and click-through. Everything lives inside
      #companion-root, which is moved around with a single transform so the
      browser only has to composite one layer per frame.
    -->
    <div id="companion-root" class="is-hidden">
      <!-- The blue triangle companion, drawn as an SVG so it stays crisp on any DPI. -->
      <div id="cursor-triangle">
        <svg width="22" height="26" viewBox="0 0 22 26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M2 1.6L19.6 12.4C20.6 13 20.4 14.5 19.3 14.8L11.8 16.9C11.4 17 11.1 17.3 10.9 17.7L7.6 24.4C7.1 25.4 5.6 25.2 5.4 24.1L1.4 2.9C1.2 1.9 2 1.2 2 1.6Z"
            fill="#3380FF"
            stroke="#FFFFFF"
            stroke-width="1.4"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <!-- Live microphone level while the user holds the push-to-talk keys. -->
      <div id="companion-waveform">
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
        <div class="waveform-bar"></div>
      </div>

      <!-- Shown while Clicky is thinking, before the voice starts. -->
      <div id="companion-spinner"></div>

      <!-- Holds either the spoken response or the label of a pointed-at element. -->
      <div id="companion-bubble">
        <div id="companion-bubble-text"></div>
      </div>
    </div>

    <script src="overlay.js"></script>
  </body>
</html>
